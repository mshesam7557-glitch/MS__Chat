<body>
<div id="login">
<h1>💬 MS Chat</h1><h3 id="authTitle">ورود به حساب</h3>
<input id="username" placeholder="نام کاربری" autocomplete="username">
<input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password">
<button onclick="authAction()">ورود</button>
<p id="switchMode" onclick="switchAuthMode()">حساب ندارم؛ ثبت‌نام کنم</p><p id="loginMessage"></p>
</div>

<div id="chat" class="hidden">
<aside id="sidebar">
<div id="myBox">
<img id="myAvatar" class="avatar" alt="">
<div id="myInfo"><div id="myUsername" class="itemName"></div><div class="muted">حساب من</div></div>
</div>
<button class="sideBtn" onclick="openProfile()">👤 پروفایل</button>
<button class="sideBtn" onclick="openChangePassword()">🔐 تغییر رمز</button>
<button class="sideBtn" onclick="openGroupPopup()">👥 ساخت گروه</button>
<button class="sideBtn" onclick="enablePushNotifications()">🔔 فعال‌کردن اعلان</button>
<button class="sideBtn hidden" id="adminButton" onclick="openAdminPopup()">👑 مدیریت کاربران</button>
<button class="sideBtn" onclick="logout()">🚪 خروج</button>
<hr>
<div class="sectionTitle">💬 چت‌های اخیر</div>
<input id="userSearch" placeholder="🔎 جستجوی کاربر..." oninput="searchUsersDebounced()">
<div id="searchResults"></div>
<div id="users"></div>
<div id="groupsHeader"><div class="sectionTitle">گروه‌ها</div><button onclick="loadGroups()">🔄</button></div><div id="groups"></div>
</aside>

<main id="chatArea">
<header id="chatHeader">
<div id="chatAvatar">👤</div>
<div class="chatTitleWrap"><div id="chatTitle" class="chatTitle">یک نفر را انتخاب کن 👈</div><div id="chatSub" class="chatSub"></div></div>
<button id="callButton" class="callBtn" onclick="startCall('audio')" disabled>📞</button>
<button id="videoButton" class="callBtn videoBtn" onclick="startCall('video')" disabled>📹</button>
<button id="membersButton" class="callBtn" onclick="showGroupMembers()" style="display:none">👥</button><button id="deleteGroupButton" class="callBtn danger" onclick="deleteGroup()" style="display:none">🗑️</button>

</header>
<section id="messages"></section>

<input id="message" placeholder="پیامت رو بنویس..." disabled onkeydown="handleEnter(event)">
<input id="imageInput" type="file" accept="image/*" onchange="sendSelectedImage()">
<button onclick="document.getElementById('imageInput').click()" id="imageButton" disabled>🖼️</button>
<button class="record" onclick="toggleRecording()" id="recordButton" disabled>🎤</button>
<button class="primary" onclick="sendMessage()" id="sendButton" disabled>ارسال</button>
</div>
</main></div>

<div id="profilePopup" class="popup"><div class="popupCard">
<h3>👤 پروفایل</h3><img id="avatarPreview" alt="">
<p>نام کاربری: <b id="profileUsername"></b></p>
<input id="displayName" placeholder="نام نمایشی">
<input id="avatarFile" type="file" accept="image/*">
<div class="row"><button onclick="uploadAvatar()">🖼️ تغییر عکس</button><button class="danger" onclick="deleteAvatar()">🗑️ حذف عکس</button></div>
<button onclick="saveProfile()">💾 ذخیره</button><button class="danger" onclick="openPopup('accountDeletePopup')">🗑️ حذف حساب</button><button onclick="closeProfile()">بستن</button><p id="profileMessage"></p>
</div></div>

<div id="passwordPopup" class="popup"><div class="popupCard">
<h3>🔐 تغییر رمز</h3><input id="currentPassword" type="password" placeholder="رمز فعلی"><input id="newPassword" type="password" placeholder="رمز جدید"><input id="confirmPassword" type="password" placeholder="تکرار رمز جدید">
<button onclick="changePassword()">تغییر رمز</button><button onclick="closePopup('passwordPopup')">بستن</button><p id="passwordMessage"></p>
</div></div>

<div id="groupPopup" class="popup"><div class="popupCard">
<h3>👥 ساخت گروه</h3><input id="groupName" placeholder="اسم گروه">
<input id="groupAvatar" type="file" accept="image/*">
<div class="sectionTitle">اعضای گروه</div><input id="groupMemberSearch" placeholder="جستجوی عضو..." oninput="loadGroupMemberCandidates()"><div id="members"></div>
<button onclick="createGroup()">ساخت گروه</button><button onclick="closePopup('groupPopup')">بستن</button><p id="groupMessage"></p>
</div></div>

<div id="groupMembersPopup" class="popup"><div class="popupCard">
<h3 id="groupMembersTitle">👥 اعضای گروه</h3>

<button onclick="closePopup('groupMembersPopup')">بستن</button>
</div></div>

<div id="adminPopup" class="popup"><div class="popupCard"><h3>👑 مدیریت کاربران</h3><div id="adminUsers"></div><button onclick="closePopup('adminPopup')">بستن</button><p id="adminMessage"></p></div></div>

<div id="accountDeletePopup" class="popup"><div class="popupCard"><h3>🗑️ حذف حساب</h3><p>این عملیات قابل بازگشت نیست.</p><button class="danger" onclick="deleteMyAccount()">حذف حساب من</button><button onclick="closePopup('accountDeletePopup')">انصراف</button><p id="accountDeleteMessage"></p></div></div>

<div id="incomingPopup" class="popup"><div class="popupCard" style="text-align:center">
<h3 id="incomingText">تماس ورودی</h3><button onclick="acceptCall()">✅ قبول</button><button onclick="rejectCall()" class="danger">❌ رد</button>
</div></div>

<div id="videoOverlay"><div class="videoCard">
<video id="remoteVideo" class="remoteVideo" autoplay playsinline></video><video id="localVideo" class="localVideo" autoplay muted playsinline></video>
<div class="videoControls"><button onclick="hangUp()">❌ پایان تماس</button></div>
</div></div>
<div id="imageViewer" onclick="this.style.display='none'"><img id="fullImage" class="fullImage"></div>
<audio id="remoteAudio" autoplay playsinline></audio>

<script>

let isRegisterMode=false,currentUsername="",currentDisplayName="",authToken="",currentAvatar="",socket=null;
let selectedType="",selectedUser="",selectedGroupId=null,selectedGroup=null,usersCache=[],groupsCache=[];
let userMap=new Map(),groupMap=new Map(),messageMap=new Map(),messageDataMap=new Map(),userButtonMap=new Map(),groupButtonMap=new Map();
let creatingGroup=false,searchTimer=null,unreadState={direct:{},groups:{}};
const OWNER_USERNAME="MS__Hesam";
let mediaRecorder=null,audioChunks=[],isRecording=false,replyTo=null;
let peerConnection=null,localStream=null,incomingCaller="",incomingOffer=null,incomingMode="audio",pendingCandidates=[];
let incomingCallId="",activeCallId="",callTimer=null,rtcConfig={iceServers:[{urls:"stun:stun.cloudflare.com:3478"},{urls:"stun:stun.l.google.com:19302"}]};
let rtcConfigLoadedAt=0;
async function loadRtcConfig(force=false){
 // Calling the Render API here was making calls wait on a slow/blocked request.
 // For the no-TURN setup, use the known public STUN servers immediately.
 // Optionally refresh from the server, but NEVER block call setup on it.
 if(!force && Date.now()-rtcConfigLoadedAt<240000)return rtcConfig;
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),1800);
 try{
   const r=await fetch(`/api/rtc-config?username=${encodeURIComponent(currentUsername)}&token=${encodeURIComponent(authToken)}`,{cache:'no-store',signal:controller.signal});
   if(r.ok){
     const d=await r.json();
     if(d.success&&Array.isArray(d.ice_servers)&&d.ice_servers.length)rtcConfig={iceServers:d.ice_servers};
   }
 }catch(e){console.warn('RTC config unavailable; using built-in STUN:',e?.name||e)}
 finally{clearTimeout(timer);rtcConfigLoadedAt=Date.now()}
 return rtcConfig;
}
function normalizeSessionDescription(desc){
 if(!desc)return null;
 const type=typeof desc.type==='string'?desc.type.trim():'';
 const sdp=typeof desc.sdp==='string'?desc.sdp:'';
 if(!type||!sdp)return null;
 return {type,sdp};
}
function newCallId(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`}
function clearCallTimer(){if(callTimer){clearTimeout(callTimer);callTimer=null}}

function qs(id){return document.getElementById(id)}
function openPopup(id){qs(id).style.display="flex"} function closePopup(id){qs(id).style.display="none"}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function initials(name){return (name||"?").trim().slice(0,1)}
function authParams(){return `viewer=${encodeURIComponent(currentUsername)}&token=${encodeURIComponent(authToken)}`}
function userAvatarUrl(username){return `/avatar/${encodeURIComponent(username)}?${authParams()}`}
function groupAvatarUrl(id){return `/group-avatar/${encodeURIComponent(id)}?username=${encodeURIComponent(currentUsername)}&token=${encodeURIComponent(authToken)}`}
function messageFileUrl(id,download=false){return `/message-file/${encodeURIComponent(id)}?username=${encodeURIComponent(currentUsername)}&token=${encodeURIComponent(authToken)}${download?'&download=1':''}`}
function setAvatar(el,url,name,fallbackUrl=""){el.innerHTML="";let src=url||"";if(src.startsWith("storage:"))src=fallbackUrl;if(src){el.src=src;el.alt=name||"";el.style.display="block";el.onerror=()=>{el.onerror=null;el.removeAttribute("src");el.style.display="grid";el.textContent=initials(name)}}else{el.removeAttribute("src");el.style.display="grid";el.textContent=initials(name)}}
function targetKey(){return selectedType==="group"?"group:"+selectedGroupId:selectedUser}
function selectedName(){return selectedType==="group"?(selectedGroup?.name||"گروه"):(usersCache.find(u=>u.username===selectedUser)?.display_name||selectedUser)}
let pushEnabled=false;
function notify(title,body){
 if(pushEnabled)return;
 if("Notification"in window && document.visibilityState!=="visible" && Notification.permission==="granted")new Notification(title,{body,icon:"/background.png"});
}
async function requestNotifications(){
 if("Notification"in window)return Notification.permission;
 return "unsupported";
}
function setPushButtonState(enabled){
 const buttons=[...document.querySelectorAll('button')].filter(b=>b.textContent.includes('اعلان'));
 buttons.forEach(b=>b.textContent=enabled?'✅ اعلان موبایل فعال است':'🔔 فعال‌کردن اعلان موبایل');
}
async function syncPushState(){
 try{
   if(!('serviceWorker' in navigator)||!('PushManager' in window))return;
   const reg=await navigator.serviceWorker.register('/sw.js');
   const sub=await reg.pushManager.getSubscription();
   pushEnabled=!!sub;
   setPushButtonState(pushEnabled);
 }catch(e){console.warn('Push state sync failed',e)}
}
async function enablePushNotifications(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){return alert('مرورگر این دستگاه اعلان Push را پشتیبانی نمی‌کند.');}
    const pk=await (await fetch('/api/push-public-key',{cache:'no-store'})).json();
    if(!pk.success||!pk.public_key){return alert('کلید اعلان روی سرور تنظیم نشده است.');}
    // Must happen directly from this button click for modern browsers.
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return alert('اجازه اعلان داده نشد.');
    await navigator.serviceWorker.register('/sw.js');
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(pk.public_key)});
    }
    const fd=new FormData();fd.append('username',currentUsername);fd.append('token',authToken);fd.append('subscription',JSON.stringify(sub));
    const d=await (await fetch('/api/push-subscribe',{method:'POST',body:fd})).json();
    if(!d.success)return alert(d.message||'فعال‌سازی اعلان ناموفق بود.');
    pushEnabled=true;
    setPushButtonState(true);
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    alert(ios ? '✅ اعلان فعال شد. در آیفون/آیپد، سایت را از Share → Add to Home Screen باز کن تا اعلان‌ها مثل اپ روی گوشی نمایش داده شوند.' : '✅ اعلان موبایل فعال شد.');
  }catch(e){console.error('Push enable error',e);alert('فعال‌سازی اعلان ناموفق بود.');}
}
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4);const raw=atob((base64String+padding).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}

function switchAuthMode(){isRegisterMode=!isRegisterMode;qs("authTitle").textContent=isRegisterMode?"ساخت حساب جدید":"ورود به حساب";document.querySelector("#login>button").textContent=isRegisterMode?"ثبت‌نام":"ورود";qs("switchMode").textContent=isRegisterMode?"حساب دارم؛ وارد شوم":"حساب ندارم؛ ثبت‌نام کنم";qs("password").autocomplete=isRegisterMode?"new-password":"current-password";qs("loginMessage").textContent=""}
async function authAction(){
 const username=qs("username").value.trim(),password=qs("password").value, msg=qs("loginMessage");if(!username||!password){msg.textContent="نام کاربری و رمز عبور را وارد کن.";return}
 const fd=new FormData();fd.append("username",username);fd.append("password",password);
 try{const r=await fetch(isRegisterMode?"/register":"/login",{method:"POST",body:fd}),d=await r.json();if(!d.success){msg.textContent=d.message;return}
 if(isRegisterMode){msg.textContent="✅ حساب ساخته شد. حالا وارد شو.";isRegisterMode=false;switchAuthMode();qs("username").value=username;return}

async function refreshUsersDirect(){

    const r=await fetch(`/api/recent-users?username=${encodeURIComponent(currentUsername)}&token=${encodeURIComponent(authToken)}`,{cache:"no-store"});
    const d=await r.json();
    if(d.success){
      const incoming=d.users||[];
      const selected=selectedType==="user"?usersCache.find(u=>u.username===selectedUser):null;
      usersCache=[...incoming];
      // While the fresh list is catching up, never make the active searched chat disappear.
      if(selected && selected.username!==currentUsername && !usersCache.some(u=>u.username===selected.username)){
        usersCache.unshift(selected);

}

let wsReconnectDelay=1500;
function connectWebSocket(){
 if(!currentUsername||!authToken)return;
 if(socket&&(socket.readyState===WebSocket.OPEN||socket.readyState===WebSocket.CONNECTING))return;
 const protocol=location.protocol==="https:"?"wss:":"ws:";
 try{socket=new WebSocket(`${protocol}//${location.host}/chat/${encodeURIComponent(currentUsername)}/${encodeURIComponent(authToken)}`)}catch(e){scheduleWsReconnect();return}
 socket.onopen=()=>{
   console.log("WebSocket connected");
   wsReconnectDelay=1500;
   try{socket.send(JSON.stringify({action:"users"}))}catch{}
   updateConnectionUI(true);
   const pending=window.pendingSocketMessages||[];
   window.pendingSocketMessages=[];
   for(const payload of pending){try{socket.send(JSON.stringify(payload))}catch{window.pendingSocketMessages.unshift(payload);break}}
 };
 socket.onmessage=e=>{try{handleSocket(JSON.parse(e.data))}catch(err){console.error("WebSocket message error",err)}};
 socket.onerror=e=>{console.warn("WebSocket error",e)};
 socket.onclose=()=>{
   console.warn("WebSocket closed");
   updateConnectionUI(false);
   scheduleWsReconnect();
 };
}
function scheduleWsReconnect(){
 if(!currentUsername||!authToken)return;
 clearTimeout(window.wsReconnectTimer);
 const delay=wsReconnectDelay;
 wsReconnectDelay=Math.min(wsReconnectDelay*2,15000);
 window.wsReconnectTimer=setTimeout(()=>{connectWebSocket()},delay);
}
function sendWs(payload){
 if(socket?.readyState===WebSocket.OPEN){try{socket.send(JSON.stringify(payload));return true}catch{}}
 window.pendingSocketMessages=window.pendingSocketMessages||[];
 window.pendingSocketMessages.push(payload);

}

 if(d.type==="recent-users"){usersCache=d.users||[];userMap=new Map(usersCache.map(u=>[u.username,u]));renderUsers();syncCallButtons();return}

 if(d.type==="groups"){groupsCache=d.groups||[];groupMap=new Map(groupsCache.map(g=>[String(g.id),g]));renderGroups();return}

 if(d.type==="message"){
   const m=d.message;
   if((selectedType==="group"&&m.group_id===selectedGroupId)||(selectedType==="user"&&m.sender===selectedUser)){
     addMessageObj(m,false);

   }else{
     markNew(d.message.group_id?`group:${d.message.group_id}`:d.message.sender);
   }
   if(!m.group_id) scheduleRecentUsersRefresh();
   notify(d.message.group_id?(groupsCache.find(g=>g.id===d.message.group_id)?.name||"گروه"):d.message.sender,d.message.message||"📎 فایل جدید"); return
 }
 if(d.type==="sent"){

     if((selectedType==="group"&&d.message.group_id===selectedGroupId)||(selectedType==="user"&&d.message.receiver===selectedUser))addMessageObj(d.message,true);

   openPopup("incomingPopup");return;
 }

   if(activeCallId&&d.call_id&&d.call_id!==activeCallId)return;
   if(peerConnection){try{const normalizedAnswer=normalizeSessionDescription(d.answer);if(!normalizedAnswer)throw new Error('Received answer SDP is invalid');await peerConnection.setRemoteDescription(normalizedAnswer);await processPendingCandidates()}catch(e){console.error('Call answer error',e);alert('برقراری تماس ناموفق بود: '+(e?.message||e))}}
   return;
 }
 if(d.type==="ice-candidate"){
   const cid=d.call_id||activeCallId||incomingCallId;
   if(activeCallId&&d.call_id&&d.call_id!==activeCallId)return;
   if(incomingCallId&&d.call_id&&d.call_id!==incomingCallId)return;
   if(peerConnection?.remoteDescription){try{await peerConnection.addIceCandidate(d.candidate)}catch(e){console.warn('ICE candidate error',e)}}else if(cid){pendingCandidates.push({call_id:cid,candidate:d.candidate})}

 if(d.type==="call-ended"){if(!activeCallId||!d.call_id||d.call_id===activeCallId)endCall();return}

}

async function toggleRecording(){if(isRecording){mediaRecorder.stop();isRecording=false;qs("recordButton").textContent="🎤";qs("recordButton").classList.remove("recording");return}if(!selectedType)return;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(audioChunks,{type:"audio/webm"});const fd=new FormData();fd.append("sender",currentUsername);fd.append("receiver",targetKey());fd.append("token",authToken);fd.append("audio",blob,"voice.webm");fd.append("reply_to",replyTo?.id||"");try{const d=await (await fetch("/upload-audio",{method:"POST",body:fd})).json();if(d.success&&d.message)addMessageObj(d.message,true);else alert(d.message||"ارسال ویس ناموفق بود")}catch{alert("ارسال ویس ناموفق بود")}cancelReply()};mediaRecorder.start();isRecording=true;qs("recordButton").textContent="⏹";qs("recordButton").classList.add("recording")}catch{alert("دسترسی به میکروفون ممکن نشد")}}

async function createGroup(){
 if(creatingGroup)return;
 const name=qs("groupName").value.trim();
 const msg=qs("groupMessage");
 if(!name){msg.textContent="اسم گروه را وارد کن.";return}
 const picks=[...qs("members").querySelectorAll("input:checked")].map(x=>x.value);
 const fd=new FormData();
 fd.append("username",currentUsername);fd.append("token",authToken);fd.append("name",name);fd.append("members",picks.join(","));
 const requestKey=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random());
 fd.append("request_key",requestKey);
 const f=qs("groupAvatar").files[0];if(f)fd.append("avatar",f);
 creatingGroup=true;
 const button=document.querySelector('#groupPopup button[onclick="createGroup()"]');
 if(button){button.disabled=true;button.textContent="در حال ساخت..."}
 try{
   const r=await fetch("/create-group",{method:"POST",body:fd});
   const d=await r.json();
   if(d.success){
     if(d.group&&!groupsCache.some(g=>String(g.id)===String(d.group.id)))groupsCache.unshift(d.group);
     renderGroups();
     closePopup("groupPopup");
   }else msg.textContent=d.message||"ساخت گروه ناموفق بود.";
 }catch(e){console.error(e);msg.textContent="ارتباط با سرور برقرار نشد."}
 finally{
   creatingGroup=false;
   if(button){button.disabled=false;button.textContent="ساخت گروه"}
 }
}

function createPeerConnection(other,mode,callId){
  peerConnection=new RTCPeerConnection(rtcConfig);
  peerConnection.onicecandidate=e=>{
    if(!e.candidate)return;
    console.log("ICE candidate gathered:",e.candidate.type||"unknown",e.candidate.protocol||"");
    sendWs({action:"ice-candidate",to:other,candidate:e.candidate,call_id:callId});
  };
  peerConnection.ontrack=e=>{
    if(!e.streams?.[0])return;
    if(mode==="video"){
      const v=qs("remoteVideo");v.srcObject=e.streams[0];v.autoplay=true;v.playsInline=true;v.play?.().catch(err=>console.warn("Remote video play blocked:",err));
    }else{
      const a=qs("remoteAudio");a.srcObject=e.streams[0];a.autoplay=true;a.muted=false;a.volume=1;a.play?.().catch(err=>console.warn("Remote audio play blocked:",err));
    }
  };
  peerConnection.onicegatheringstatechange=()=>console.log("ICE gathering:",peerConnection?.iceGatheringState);
  peerConnection.oniceconnectionstatechange=()=>{
    const s=peerConnection?.iceConnectionState;console.log("ICE state:",s);
    if(s==="failed"){qs("chatSub").textContent="🔴 اتصال تماس ناموفق بود";console.error("ICE connection failed",{callId:activeCallId,config:rtcConfig});}
    else if(s==="disconnected")qs("chatSub").textContent="🟠 اتصال تماس ناپایدار...";
    else if(s==="connected"||s==="completed"){clearCallTimer();qs("chatSub").textContent="🟢 تماس برقرار شد";}
  };
  peerConnection.onconnectionstatechange=()=>{
    const s=peerConnection?.connectionState;console.log("Peer state:",s);
    if(s==="connected"){clearCallTimer();qs("chatSub").textContent="🟢 تماس برقرار شد";}
    if(["failed","closed"].includes(s)&&activeCallId)endCall();
  };
  peerConnection.onicecandidateerror=e=>console.warn("ICE server error",e.errorCode,e.url,e.errorText);
  return peerConnection;
}
function waitForIceGathering(pc,timeoutMs=10000){
  return new Promise(resolve=>{
    if(!pc||pc.iceGatheringState==="complete"){resolve();return;}
    let done=false;let timer=null;
    const onState=()=>{if(pc.iceGatheringState==="complete")finish();};
    const finish=()=>{if(done)return;done=true;clearTimeout(timer);pc.removeEventListener("icegatheringstatechange",onState);resolve();};
    timer=setTimeout(()=>{console.warn("ICE gathering timeout; continuing with current SDP");finish();},timeoutMs);
    pc.addEventListener("icegatheringstatechange",onState);
  });
}
let callInitiator=false;
async function startCall(mode){
  if(selectedType!=="user")return alert("تماس فقط با کاربر است.");if(!selectedUser)return;
  try{
    await loadRtcConfig(true);
    pendingCandidates=[];incomingCaller="";incomingOffer=null;incomingCallId="";activeCallId=newCallId();callInitiator=true;
    localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==="video"});
    createPeerConnection(selectedUser,mode,activeCallId);localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));
    if(mode==="video"){qs("localVideo").srcObject=localStream;qs("videoOverlay").style.display="flex";}
    qs("chatSub").textContent="📞 در حال تماس...";
    const offer=await peerConnection.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:mode==="video"});
    await peerConnection.setLocalDescription(offer);
    const offerDescription=normalizeSessionDescription(peerConnection.localDescription);
    if(!offerDescription)throw new Error('Offer SDP is empty or invalid');
    sendWs({action:"call-offer",to:selectedUser,offer:offerDescription,mode,call_id:activeCallId});
    showHangup();clearCallTimer();callTimer=setTimeout(()=>{alert("⏱️ تماس در ۳۰ ثانیه برقرار نشد.");if(selectedUser)sendWs({action:"call-ended",to:selectedUser,call_id:activeCallId});endCall();},30000);
  }catch(e){console.error("startCall error",e);alert("شروع تماس ناموفق بود. دسترسی میکروفون/دوربین و اتصال اینترنت را بررسی کن.");endCall();}
}
async function acceptCall(){
  closePopup("incomingPopup");selectedType="user";selectedUser=incomingCaller;
  const thisCallId=incomingCallId||activeCallId||newCallId();activeCallId=thisCallId;callInitiator=false;
  const u=usersCache.find(x=>x.username===incomingCaller);if(u){setHeader(u.display_name,u.avatar,userAvatarUrl(u.username),u.online?"🟢 آنلاین":u.last_seen?"آخرین بازدید: "+formatDate(u.last_seen):"⚫ آفلاین");enableComposer(true);}
  try{
    await loadRtcConfig(true);localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:incomingMode==="video"});
    createPeerConnection(incomingCaller,incomingMode,thisCallId);localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));
    if(incomingMode==="video"){qs("localVideo").srcObject=localStream;qs("videoOverlay").style.display="flex";}
    const normalizedOffer=normalizeSessionDescription(incomingOffer);
    if(!normalizedOffer)throw new Error('Received offer SDP is invalid');
    await peerConnection.setRemoteDescription(normalizedOffer);
    const ans=await peerConnection.createAnswer({offerToReceiveAudio:true,offerToReceiveVideo:incomingMode==="video"});
    await peerConnection.setLocalDescription(ans);
    const answerDescription=normalizeSessionDescription(peerConnection.localDescription);
    if(!answerDescription)throw new Error('Answer SDP is empty or invalid');
    sendWs({action:"call-answer",to:incomingCaller,answer:answerDescription,call_id:thisCallId});
    showHangup();incomingCaller="";incomingOffer=null;incomingCallId="";clearCallTimer();callTimer=setTimeout(()=>{alert("⏱️ تماس برقرار نشد.");endCall();},30000);
  }catch(e){console.error("acceptCall error",e);alert("پذیرش تماس ناموفق بود: "+(e?.message||e));if(incomingCaller)sendWs({action:"call-rejected",to:incomingCaller,call_id:thisCallId});endCall();}
}
function rejectCall(){const cid=incomingCallId||activeCallId;if(incomingCaller)sendWs({action:"call-rejected",to:incomingCaller,call_id:cid});closePopup("incomingPopup");incomingCaller="";incomingOffer=null;incomingCallId="";activeCallId="";}
function showHangup(){qs("callButton").style.display="none";qs("videoButton").style.display="none";qs("hangupButton").style.display="inline-block";}
function hangUp(){if(selectedUser&&activeCallId)sendWs({action:"call-ended",to:selectedUser,call_id:activeCallId});endCall();}
function endCall(){
  clearCallTimer();if(peerConnection){peerConnection.onconnectionstatechange=null;try{peerConnection.close()}catch{};peerConnection=null;}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
  qs("remoteAudio").srcObject=null;qs("remoteVideo").srcObject=null;qs("localVideo").srcObject=null;qs("videoOverlay").style.display="none";pendingCandidates=[];activeCallId="";callInitiator=false;
  qs("callButton").style.display="inline-block";qs("videoButton").style.display="inline-block";qs("hangupButton").style.display="none";syncCallButtons();
}
async function processPendingCandidates(){
  if(!peerConnection?.remoteDescription||!pendingCandidates.length)return;
  const list=pendingCandidates.splice(0);
  for(const item of list){
    if(!item?.candidate)continue;
    try{await peerConnection.addIceCandidate(item.candidate)}catch(e){console.warn("Pending ICE candidate error:",e)}
  }
}
function formatDate(s){if(!s)return"";const d=new Date(String(s).replace(" ","T"));return isNaN(d)?String(s):d.toLocaleString("fa-IR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}
